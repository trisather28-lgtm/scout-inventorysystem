        // Initialize Local Storage database if needed
        function initLocalDatabase() {
            if (!localStorage.getItem("scout_store_users")) {

        // ==========================================
        // TOAST NOTIFICATION UTILITY
        // ==========================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-scout-green text-white' : (type === 'error' ? 'bg-red-600 text-white' : 'bg-amber-600 text-white');
            const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-exclamation' : 'fa-triangle-exclamation');
            
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border border-white/20 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto ${bgColor}`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-lg"></i>
                <span class="text-sm font-medium">${message}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

            const modalContent = document.getElementById('modal-content');

            modalContainer.classList.remove('hidden');

        function closeModal() {
            const modalContainer = document.getElementById('modal-container');
            modalContainer.classList.add('hidden');

        // ==========================================

            const passwordInput = document.getElementById('login-password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...`;

            // Master Admin Special Authentication Logic (trisather28@gmail.com)
            const MASTER_ADMIN_EMAIL = "trisather28@gmail.com";

            setTimeout(() => {
                let foundUser = null;

                // 1. Check if email matches Master Admin

                    foundUser = {
                        uid: "master_admin_trisather",
                        email: MASTER_ADMIN_EMAIL,
                        name: "Tristan Sather",
                        role: "admin", // Master Admin Role
                        patrol: "Quartermaster Staff"
                    };
                } else {
                    // 2. Check local database users
                    const users = getLocalUsers();
                    foundUser = users.find(u => u.email.toLowerCase() === emailInput.toLowerCase());
                }

                if (foundUser) {
                    state.currentUser = foundUser;
                    showToast(`Welcome back, ${foundUser.name}! (${foundUser.role.toUpperCase()})`);
                    render();
                } else {
                    // Graceful fallback for new login test: register as standard Scout if not found
                    state.currentUser = {
                        uid: "user_" + Date.now(),
                        email: emailInput,
                        name: emailInput.split('@')[0].replace('.', ' ').toUpperCase(),
                        role: emailInput.toLowerCase().includes('admin') ? 'admin' : 'scout',
                        patrol: 'Beaver Patrol'

                    // Add to user database
                    const users = getLocalUsers();
                    users.push(state.currentUser);
                    saveLocalUsers(users);

                    showToast(`Signed in as ${state.currentUser.name}`);
                    render();
                }
            }, 600);
        }

                        </button>
                        ${isAdmin ? `
                        <button onclick="switchTab('users')" class="p-2 flex flex-col items-center ${state.activeTab === 'users' ? 'text-scout-khaki font-bold' : 'text-gray-300'}">
                            <i class="fa-solid fa-users-gear text-base mb-0.5"></i>
                            <span>Roster</span>
                        </button>
                        ` : ''}
                    </div>
                </header>

                <!-- Main Content Body -->
                <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                    ${renderTabContent()}
                </main>

                <!-- Footer -->
                <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
                    <p>© 2026 Scout Quartermaster Store • Built for Scouting Excellence</p>
                </footer>
            `;
        }

        function switchTab(tabName) {
            state.activeTab = tabName;
            render();
        }

        function getPendingRequestsCount() {
            const requests = getLocalRequests();
            return requests.filter(r => r.status === 'Pending').length;
        }

        function handleLogout() {
            state.currentUser = null;
            showToast("Logged out successfully");
            render();
        }

        // ==========================================
        // 3. TAB CONTENT ROUTER
        // ==========================================
        function renderTabContent() {
            switch (state.activeTab) {
                case 'inventory': return renderInventoryTab();
                case 'requests': return renderRequestsTab();
                case 'loans': return renderActiveLoansTab();
                case 'users': return renderUsersTab();
                default: return renderInventoryTab();
            }
        }

        // ==========================================
        // 4. INVENTORY STORE TAB
        // ==========================================
        function renderInventoryTab() {
            const items = getLocalItems();
            const isAdmin = state.currentUser.role === 'admin';

            // Filter logic
            const filteredItems = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                                      item.category.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                                      item.description.toLowerCase().includes(state.searchQuery.toLowerCase());
                const matchesCategory = state.categoryFilter === 'All' || item.category === state.categoryFilter;
                return matchesSearch && matchesCategory;
            });

            const categories = ['All', 'Camping Gear', 'Cooking Equipment', 'Navigation & Tools', 'First Aid & Safety', 'Pioneering & Ropes'];

            return `
                <div class="space-y-6">
                    
                    <!-- Header Banner & Action -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                        <div>
                            <h2 class="text-xl font-bold font-heading text-scout-green">Troop Equipment Store</h2>
                            <p class="text-xs text-gray-500 mt-0.5">Browse available gear, submit checkout requests for outdoor activities, or manage inventory.</p>
                        </div>
                        ${isAdmin ? `
                            <button onclick="openAddItemModal()" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-scout-green hover:bg-scout-green-light text-white font-medium rounded-xl shadow transition text-sm">
                                <i class="fa-solid fa-plus"></i>
                                <span>Add New Gear</span>
                            </button>
                        ` : ''}
                    </div>

                    <!-- Search and Filters Bar -->
                    <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                        <!-- Search Box -->
                        <div class="relative w-full md:w-80">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </span>
                            <input type="text" value="${state.searchQuery}" oninput="handleSearchInput(event)"
                                placeholder="Search tent, stove, compass..."
                                class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-scout-green">
                        </div>

                        <!-- Category Pill Filters -->
                        <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                            ${categories.map(cat => `
                                <button onclick="setCategoryFilter('${cat}')"
                                    class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${state.categoryFilter === cat ? 'bg-scout-green text-white shadow-sm' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'}">
                                    ${cat}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Inventory Grid -->
                    ${filteredItems.length === 0 ? `
                        <div class="bg-white rounded-2xl p-12 text-center border border-gray-200">
                            <div class="w-16 h-16 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                                <i class="fa-solid fa-box-open"></i>
                            </div>
                            <h3 class="text-base font-semibold text-gray-700">No equipment found</h3>
                            <p class="text-xs text-gray-500 mt-1">Try adjusting your search terms or category filter.</p>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${filteredItems.map(item => renderItemCard(item, isAdmin)).join('')}
                        </div>
                    `}

                </div>
            `;
        }

        function renderItemCard(item, isAdmin) {
            const isAvailable = item.availableQty > 0;
            const statusBadgeClass = isAvailable ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-rose-100 text-rose-800 border-rose-200';

            return `
                <div class="bg-white rounded-2xl shadow-sm hover:shadow-md border border-gray-200 overflow-hidden flex flex-col transition-shadow">
                    
                    <!-- Item Image / Header -->
                    <div class="h-44 bg-gray-100 relative overflow-hidden group">
                        <img src="${item.imageUrl}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/500x300/1e3a2b/ffffff?text=Scout+Gear'">
                        
                        <!-- Status Badge -->
                        <span class="absolute top-3 right-3 px-2.5 py-1 rounded-lg text-xs font-bold border shadow-sm ${statusBadgeClass}">
                            ${isAvailable ? `${item.availableQty} / ${item.totalQty} Available` : 'Out of Stock'}
                        </span>

                        <!-- Category Tag -->
                        <span class="absolute bottom-3 left-3 px-2.5 py-1 bg-black/60 backdrop-blur-md text-white rounded-lg text-[11px] font-medium">
                            <i class="fa-solid ${item.icon || 'fa-tag'} mr-1"></i> ${item.category}
                        </span>
                    </div>

                    <!-- Card Body -->
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex items-start justify-between gap-2 mb-1">
                                <h3 class="font-bold text-gray-800 text-base leading-snug">${item.name}</h3>
                            </div>
                            <p class="text-xs text-gray-500 line-clamp-2 mb-4">${item.description}</p>
                        </div>

                        <div>
                            <!-- Meta Details -->
                            <div class="grid grid-cols-2 gap-2 text-xs bg-gray-50 p-2.5 rounded-xl border border-gray-100 mb-4">
                                <div>
                                    <span class="text-gray-400 block text-[10px] uppercase font-semibold">Location</span>
                                    <span class="font-medium text-gray-700">${item.location}</span>
                                </div>
                                <div>
                                    <span class="text-gray-400 block text-[10px] uppercase font-semibold">Condition</span>
                                    <span class="font-medium text-gray-700">${item.condition}</span>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="flex items-center gap-2">
                                ${isAdmin ? `
                                    <button onclick="openEditItemModal('${item.id}')" class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium text-xs rounded-xl transition">
                                        <i class="fa-solid fa-pen-to-square mr-1"></i> Edit
                                    </button>
                                    <button onclick="handleDeleteItem('${item.id}')" class="p-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl transition text-xs" title="Delete">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                ` : ''}

                                <button onclick="openRequestModal('${item.id}')" ${!isAvailable ? 'disabled' : ''}
                                    class="flex-1 py-2.5 ${isAvailable ? 'bg-scout-green hover:bg-scout-green-light text-white' : 'bg-gray-200 text-gray-400 cursor-not-allowed'} font-semibold text-xs rounded-xl shadow-sm transition flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-hand-holding"></i>
                                    <span>${isAvailable ? 'Request Checkout' : 'Unavailable'}</span>
                                </button>
                            </div>
                        </div>

                    </div>

                </div>
            `;
        }

        function handleSearchInput(e) {
            state.searchQuery = e.target.value;
            render();
        }

        function setCategoryFilter(category) {
            state.categoryFilter = category;
            render();
        }

        // ==========================================
        // 5. CHECKOUT REQUEST MODAL & LOGIC
        // ==========================================
        function openRequestModal(itemId) {
            const items = getLocalItems();
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            openModal(`
                <div>
                    <div class="flex justify-between items-center pb-3 border-b mb-4">
                        <h3 class="text-lg font-bold font-heading text-scout-green">Request Equipment Checkout</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    <div class="bg-scout-khaki-light p-3 rounded-xl border border-scout-khaki/30 mb-4 flex items-center gap-3">
                        <div class="w-10 h-10 bg-scout-green text-scout-khaki rounded-lg flex items-center justify-center text-lg">
                            <i class="fa-solid ${item.icon || 'fa-box'}"></i>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800 text-sm">${item.name}</div>
                            <div class="text-xs text-gray-500">${item.availableQty} units currently in stock</div>
                        </div>
                    </div>

                    <form onsubmit="submitCheckoutRequest(event, '${item.id}')" class="space-y-4 text-xs">
                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Quantity Requested</label>
                            <input type="number" id="req-qty" min="1" max="${item.availableQty}" value="1" required
                                class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-scout-green text-sm">
                        </div>

                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Expected Return Date</label>
                            <input type="date" id="req-return-date" required
                                class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-scout-green text-sm">
                        </div>

                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Purpose / Event Name</label>
                            <textarea id="req-purpose" rows="2" required placeholder="e.g. Patrol Camporee, Badge Activity, Troop Hike"
                                class="w-full p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-scout-green text-sm"></textarea>
                        </div>

                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 border border-gray-300 text-gray-700 font-medium rounded-xl hover:bg-gray-50">Cancel</button>
                            <button type="submit" class="flex-1 py-2.5 bg-scout-green text-white font-semibold rounded-xl hover:bg-scout-green-light">Submit Request</button>
                        </div>
                    </form>
                </div>
            `);

            // Set default date picker to 7 days from now
            const nextWeek = new Date();
            nextWeek.setDate(nextWeek.getDate() + 7);
            document.getElementById('req-return-date').value = nextWeek.toISOString().split('T')[0];
        }

        function submitCheckoutRequest(e, itemId) {
            e.preventDefault();
            const items = getLocalItems();
            const item = items.find(i => i.id === itemId);
            const qty = parseInt(document.getElementById('req-qty').value);
            const returnDate = document.getElementById('req-return-date').value;
            const purpose = document.getElementById('req-purpose').value;

            if (qty > item.availableQty) {
                showToast("Requested quantity exceeds stock available", "error");
                return;
            }

            const requests = getLocalRequests();
            const newRequest = {
                id: 'req_' + Date.now(),
                itemId: item.id,
                itemName: item.name,
                userEmail: state.currentUser.email,
                userName: state.currentUser.name,
                userPatrol: state.currentUser.patrol || 'Scout Member',
                qty: qty,
                requestDate: new Date().toISOString().split('T')[0],
                expectedReturnDate: returnDate,
                purpose: purpose,
                status: 'Pending',
                approvedBy: null
            };

            requests.unshift(newRequest);
            saveLocalRequests(requests);

            closeModal();
            showToast("Checkout request submitted to Quartermaster!");
            state.activeTab = 'requests';
            render();
        }

        // ==========================================
        // 6. REQUESTS TAB (SCOUT & ADMIN VIEW)
        // ==========================================
        function renderRequestsTab() {
            const requests = getLocalRequests();
            const isAdmin = state.currentUser.role === 'admin';

            // Filter requests based on role
            const displayRequests = isAdmin ? requests : requests.filter(r => r.userEmail === state.currentUser.email);

            return `
                <div class="space-y-6">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                        <h2 class="text-xl font-bold font-heading text-scout-green">${isAdmin ? 'Troop Checkout Requests' : 'My Equipment Requests'}</h2>
                        <p class="text-xs text-gray-500 mt-0.5">${isAdmin ? 'Review and manage incoming equipment checkout requests from scouts.' : 'Track the status of your requested troop gear.'}</p>
                    </div>

                    ${displayRequests.length === 0 ? `
                        <div class="bg-white rounded-2xl p-12 text-center border border-gray-200">
                            <div class="w-16 h-16 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                                <i class="fa-solid fa-clipboard-check"></i>
                            </div>
                            <h3 class="text-base font-semibold text-gray-700">No requests found</h3>
                            <p class="text-xs text-gray-500 mt-1">Submit a checkout request from the Store page to get started.</p>
                        </div>
                    ` : `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-gray-50 text-gray-500 uppercase border-b border-gray-200">
                                            <th class="p-4">Item Details</th>
                                            <th class="p-4">Requested By</th>
                                            <th class="p-4">Dates</th>
                                            <th class="p-4">Purpose</th>
                                            <th class="p-4">Status</th>
                                            ${isAdmin ? '<th class="p-4 text-right">Actions</th>' : ''}
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-200">
                                        ${displayRequests.map(req => renderRequestRow(req, isAdmin)).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        function renderRequestRow(req, isAdmin) {
            let statusBadge = '';
            if (req.status === 'Pending') statusBadge = '<span class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-md font-semibold">Pending</span>';
            else if (req.status === 'Approved') statusBadge = '<span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-md font-semibold">Approved</span>';
            else if (req.status === 'Rejected') statusBadge = '<span class="px-2.5 py-1 bg-rose-100 text-rose-800 rounded-md font-semibold">Rejected</span>';
            else if (req.status === 'Returned') statusBadge = '<span class="px-2.5 py-1 bg-gray-100 text-gray-700 rounded-md font-semibold">Returned</span>';

            return `
                <tr class="hover:bg-gray-50">
                    <td class="p-4">
                        <div class="font-bold text-gray-800">${req.itemName}</div>
                        <div class="text-gray-500 text-[11px]">Qty: ${req.qty}</div>
                    </td>
                    <td class="p-4">
                        <div class="font-medium text-gray-800">${req.userName}</div>
                        <div class="text-gray-500 text-[11px]">${req.userPatrol}</div>
                    </td>
                    <td class="p-4">
                        <div>Req: <span class="font-medium text-gray-700">${req.requestDate}</span></div>
                        <div>Return: <span class="font-medium text-gray-700">${req.expectedReturnDate}</span></div>
                    </td>
                    <td class="p-4 max-w-xs text-gray-600 line-clamp-2">
                        ${req.purpose}
                    </td>
                    <td class="p-4">
                        ${statusBadge}
                    </td>
                    ${isAdmin ? `
                    <td class="p-4 text-right space-x-1">
                        ${req.status === 'Pending' ? `
                            <button onclick="approveRequest('${req.id}')" class="px-3 py-1.5 bg-scout-green hover:bg-scout-green-light text-white font-medium rounded-lg text-xs shadow-sm">
                                Approve
                            </button>
                            <button onclick="rejectRequest('${req.id}')" class="px-3 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 font-medium rounded-lg text-xs">
                                Reject
                            </button>
                        ` : '<span class="text-gray-400 text-[11px] italic">Processed</span>'}
                    </td>
                    ` : ''}
                </tr>
            `;
        }

        function approveRequest(reqId) {
            const requests = getLocalRequests();
            const items = getLocalItems();
            const req = requests.find(r => r.id === reqId);
            if (!req) return;

            const item = items.find(i => i.id === req.itemId);
            if (!item || item.availableQty < req.qty) {
                showToast("Not enough stock available to approve this request", "error");
                return;
            }

            // Deduct available stock
            item.availableQty -= req.qty;
            saveLocalItems(items);

            // Update request status
            req.status = 'Approved';
            req.approvedBy = state.currentUser.email;
            saveLocalRequests(requests);

            showToast(`Approved request for ${req.userName}`);
            render();
        }

        function rejectRequest(reqId) {
            const requests = getLocalRequests();
            const req = requests.find(r => r.id === reqId);
            if (!req) return;

            req.status = 'Rejected';
            saveLocalRequests(requests);

            showToast(`Request rejected`, "warn");
            render();
        }

        // ==========================================
        // 7. ACTIVE LOANS & RETURN MANAGEMENT TAB
        // ==========================================
        function renderActiveLoansTab() {
            const requests = getLocalRequests();
            const isAdmin = state.currentUser.role === 'admin';

            // Active loans are requests with status 'Approved'
            const activeLoans = requests.filter(r => r.status === 'Approved');

            return `
                <div class="space-y-6">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                        <h2 class="text-xl font-bold font-heading text-scout-green">Active Equipment Loans</h2>
                        <p class="text-xs text-gray-500 mt-0.5">Track gear currently checked out in the field and record returns.</p>
                    </div>

                    ${activeLoans.length === 0 ? `
                        <div class="bg-white rounded-2xl p-12 text-center border border-gray-200">
                            <div class="w-16 h-16 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                                <i class="fa-solid fa-handshake"></i>
                            </div>
                            <h3 class="text-base font-semibold text-gray-700">No active loans</h3>
                            <p class="text-xs text-gray-500 mt-1">All troop gear is safely returned to the quartermaster locker!</p>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${activeLoans.map(loan => renderLoanCard(loan, isAdmin)).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderLoanCard(loan, isAdmin) {
            const isOverdue = new Date(loan.expectedReturnDate) < new Date();

            return `
                <div class="bg-white p-5 rounded-2xl border ${isOverdue ? 'border-rose-300 bg-rose-50/30' : 'border-gray-200'} shadow-sm flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${isOverdue ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}">
                                ${isOverdue ? 'Overdue Return' : 'Checked Out'}
                            </span>
                            <span class="text-xs text-gray-400 font-medium">Qty: ${loan.qty}</span>
                        </div>

                        <h3 class="font-bold text-gray-800 text-base mb-1">${loan.itemName}</h3>
                        <div class="text-xs text-gray-600 mb-3"><i class="fa-solid fa-user mr-1 text-gray-400"></i> ${loan.userName} (${loan.userPatrol})</div>

                        <div class="bg-gray-50 p-3 rounded-xl text-xs space-y-1 mb-4 border border-gray-100">
                            <div class="text-gray-500">Return Due: <span class="font-bold text-gray-700">${loan.expectedReturnDate}</span></div>
                            <div class="text-gray-500 line-clamp-1">Purpose: ${loan.purpose}</div>
                        </div>
                    </div>

                    ${isAdmin ? `
                        <button onclick="handleReturnItem('${loan.id}')" class="w-full py-2.5 bg-scout-green hover:bg-scout-green-light text-white font-medium text-xs rounded-xl shadow-sm transition">
                            <i class="fa-solid fa-rotate-left mr-1"></i> Process Item Return
                        </button>
                    ` : `
                        <div class="text-center text-xs text-gray-400 italic">Return gear to Quartermaster upon arrival</div>
                    `}
                </div>
            `;
        }

        function handleReturnItem(loanId) {
            const requests = getLocalRequests();
            const items = getLocalItems();
            const loan = requests.find(r => r.id === loanId);
            if (!loan) return;

            openModal(`
                <div>
                    <h3 class="text-lg font-bold font-heading text-scout-green mb-2">Process Equipment Return</h3>
                    <p class="text-xs text-gray-600 mb-4">Confirm return details for <strong>${loan.itemName}</strong> (${loan.qty} unit/s) returned by ${loan.userName}.</p>
                    
                    <form onsubmit="confirmReturn(event, '${loan.id}')" class="space-y-4 text-xs">
                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Condition Upon Return</label>
                            <select id="return-condition" class="w-full p-2.5 border border-gray-300 rounded-xl">
                                <option value="Excellent">Excellent - Clean & functional</option>
                                <option value="Good" selected>Good - Normal wear</option>
                                <option value="Fair">Fair - Needs minor cleaning</option>
                                <option value="Needs Repair">Needs Repair / Damaged</option>
                            </select>
                        </div>

                        <div class="flex gap-3">
                            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 border border-gray-300 text-gray-700 font-medium rounded-xl">Cancel</button>
                            <button type="submit" class="flex-1 py-2.5 bg-scout-green text-white font-medium rounded-xl">Confirm Return</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function confirmReturn(e, loanId) {
            e.preventDefault();
            const requests = getLocalRequests();
            const items = getLocalItems();
            const loan = requests.find(r => r.id === loanId);
            if (!loan) return;

            const item = items.find(i => i.id === loan.itemId);
            if (item) {
                item.availableQty = Math.min(item.totalQty, item.availableQty + loan.qty);
                saveLocalItems(items);
            }

            loan.status = 'Returned';
            saveLocalRequests(requests);

            closeModal();
            showToast("Equipment returned to inventory!");
            render();
        }

        // ==========================================
        // 8. SCOUT ROSTER TAB (ADMIN ONLY)
        // ==========================================
        function renderUsersTab() {
            const users = getLocalUsers();

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                        <div>
                            <h2 class="text-xl font-bold font-heading text-scout-green">Troop Member Roster</h2>
                            <p class="text-xs text-gray-500 mt-0.5">Manage troop member user accounts and assign administrative access.</p>
                        </div>
                        <button onclick="openAddUserModal()" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-scout-green hover:bg-scout-green-light text-white font-medium rounded-xl shadow transition text-sm">
                            <i class="fa-solid fa-user-plus"></i>
                            <span>Add New Member</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-gray-50 text-gray-500 uppercase border-b border-gray-200">
                                        <th class="p-4">Name & Email</th>
                                        <th class="p-4">Patrol</th>
                                        <th class="p-4">Role</th>
                                        <th class="p-4">Phone</th>
                                        <th class="p-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-200">
                                    ${users.map(u => `
                                        <tr class="hover:bg-gray-50">
                                            <td class="p-4">
                                                <div class="font-bold text-gray-800">${u.name}</div>
                                                <div class="text-gray-500 text-[11px]">${u.email}</div>
                                            </td>
                                            <td class="p-4 text-gray-700 font-medium">${u.patrol || 'N/A'}</td>
                                            <td class="p-4">
                                                <span class="px-2.5 py-1 rounded-md text-[11px] font-bold ${u.role === 'admin' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}">
                                                    ${u.role === 'admin' ? 'Quartermaster Admin' : 'Scout Member'}
                                                </span>
                                            </td>
                                            <td class="p-4 text-gray-600">${u.phone || '—'}</td>
                                            <td class="p-4 text-right">
                                                <button onclick="handleDeleteUser('${u.uid}')" class="text-rose-600 hover:text-rose-800 p-1.5" title="Remove Member">
                                                    <i class="fa-solid fa-user-xmark text-sm"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function openAddUserModal() {
            openModal(`
                <div>
                    <h3 class="text-lg font-bold font-heading text-scout-green mb-4">Add Troop Member Account</h3>
                    <form onsubmit="submitAddUser(event)" class="space-y-4 text-xs">
                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Full Name</label>
                            <input type="text" id="user-name" required placeholder="Scout Name" class="w-full p-2.5 border border-gray-300 rounded-xl">
                        </div>

                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Email Address</label>
                            <input type="email" id="user-email" required placeholder="scout@troop.org" class="w-full p-2.5 border border-gray-300 rounded-xl">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold uppercase text-gray-600 mb-1">Role</label>
                                <select id="user-role" class="w-full p-2.5 border border-gray-300 rounded-xl">
                                    <option value="scout">Scout Member</option>
                                    <option value="admin">Quartermaster Admin</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-semibold uppercase text-gray-600 mb-1">Patrol Name</label>
                                <input type="text" id="user-patrol" placeholder="Eagle Patrol" class="w-full p-2.5 border border-gray-300 rounded-xl">
                            </div>
                        </div>

                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 border border-gray-300 text-gray-700 font-medium rounded-xl">Cancel</button>
                            <button type="submit" class="flex-1 py-2.5 bg-scout-green text-white font-medium rounded-xl">Create Account</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function submitAddUser(e) {
            e.preventDefault();
            const users = getLocalUsers();
            const name = document.getElementById('user-name').value;
            const email = document.getElementById('user-email').value;
            const role = document.getElementById('user-role').value;
            const patrol = document.getElementById('user-patrol').value || 'Unassigned Patrol';

            const newUser = {
                uid: 'user_' + Date.now(),
                name,
                email,
                role,
                patrol,
                status: 'Active'
            };

            users.push(newUser);
            saveLocalUsers(users);

            closeModal();
            showToast(`Account created for ${name}`);
            render();
        }

        function handleDeleteUser(uid) {
            let users = getLocalUsers();
            users = users.filter(u => u.uid !== uid);
            saveLocalUsers(users);
            showToast("Member account removed");
            render();
        }

        // ==========================================
        // 9. ADD / EDIT INVENTORY ITEM MODAL
        // ==========================================
        function openAddItemModal() {
            openModal(`
                <div>
                    <h3 class="text-lg font-bold font-heading text-scout-green mb-4">Add Gear To Store</h3>
                    <form onsubmit="submitSaveItem(event, null)" class="space-y-4 text-xs">
                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Item Title</label>
                            <input type="text" id="item-title" required placeholder="e.g. 2-Burner Propane Stove" class="w-full p-2.5 border border-gray-300 rounded-xl">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold uppercase text-gray-600 mb-1">Category</label>
                                <select id="item-cat" class="w-full p-2.5 border border-gray-300 rounded-xl">
                                    <option value="Camping Gear">Camping Gear</option>
                                    <option value="Cooking Equipment">Cooking Equipment</option>
                                    <option value="Navigation & Tools">Navigation & Tools</option>
                                    <option value="First Aid & Safety">First Aid & Safety</option>
                                    <option value="Pioneering & Ropes">Pioneering & Ropes</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-semibold uppercase text-gray-600 mb-1">Total Quantity</label>
                                <input type="number" id="item-qty" min="1" value="5" required class="w-full p-2.5 border border-gray-300 rounded-xl">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold uppercase text-gray-600 mb-1">Shelf / Location</label>
                                <input type="text" id="item-loc" required placeholder="Shelf A-2" class="w-full p-2.5 border border-gray-300 rounded-xl">
                            </div>
                            <div>
                                <label class="block font-semibold uppercase text-gray-600 mb-1">Condition</label>
                                <select id="item-cond" class="w-full p-2.5 border border-gray-300 rounded-xl">
                                    <option value="New">New</option>
                                    <option value="Excellent">Excellent</option>
                                    <option value="Good" selected>Good</option>
                                    <option value="Fair">Fair</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Description</label>
                            <textarea id="item-desc" rows="2" placeholder="Item description, specs, or special care notes..." class="w-full p-2.5 border border-gray-300 rounded-xl"></textarea>
                        </div>

                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Image URL (Optional)</label>
                            <input type="url" id="item-img" placeholder="https://..." class="w-full p-2.5 border border-gray-300 rounded-xl">
                        </div>

                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 border border-gray-300 text-gray-700 font-medium rounded-xl">Cancel</button>
                            <button type="submit" class="flex-1 py-2.5 bg-scout-green text-white font-medium rounded-xl">Save Gear Item</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function openEditItemModal(itemId) {
            const items = getLocalItems();
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            openModal(`
                <div>
                    <h3 class="text-lg font-bold font-heading text-scout-green mb-4">Edit Gear Item</h3>
                    <form onsubmit="submitSaveItem(event, '${item.id}')" class="space-y-4 text-xs">
                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Item Title</label>
                            <input type="text" id="item-title" value="${item.name}" required class="w-full p-2.5 border border-gray-300 rounded-xl">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold uppercase text-gray-600 mb-1">Category</label>
                                <select id="item-cat" class="w-full p-2.5 border border-gray-300 rounded-xl">
                                    <option value="Camping Gear" ${item.category === 'Camping Gear' ? 'selected' : ''}>Camping Gear</option>
                                    <option value="Cooking Equipment" ${item.category === 'Cooking Equipment' ? 'selected' : ''}>Cooking Equipment</option>
                                    <option value="Navigation & Tools" ${item.category === 'Navigation & Tools' ? 'selected' : ''}>Navigation & Tools</option>
                                    <option value="First Aid & Safety" ${item.category === 'First Aid & Safety' ? 'selected' : ''}>First Aid & Safety</option>
                                    <option value="Pioneering & Ropes" ${item.category === 'Pioneering & Ropes' ? 'selected' : ''}>Pioneering & Ropes</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-semibold uppercase text-gray-600 mb-1">Total Quantity</label>
                                <input type="number" id="item-qty" min="1" value="${item.totalQty}" required class="w-full p-2.5 border border-gray-300 rounded-xl">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold uppercase text-gray-600 mb-1">Shelf / Location</label>
                                <input type="text" id="item-loc" value="${item.location}" required class="w-full p-2.5 border border-gray-300 rounded-xl">
                            </div>
                            <div>
                                <label class="block font-semibold uppercase text-gray-600 mb-1">Condition</label>
                                <select id="item-cond" class="w-full p-2.5 border border-gray-300 rounded-xl">
                                    <option value="New" ${item.condition === 'New' ? 'selected' : ''}>New</option>
                                    <option value="Excellent" ${item.condition === 'Excellent' ? 'selected' : ''}>Excellent</option>
                                    <option value="Good" ${item.condition === 'Good' ? 'selected' : ''}>Good</option>
                                    <option value="Fair" ${item.condition === 'Fair' ? 'selected' : ''}>Fair</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Description</label>
                            <textarea id="item-desc" rows="2" class="w-full p-2.5 border border-gray-300 rounded-xl">${item.description}</textarea>
                        </div>

                        <div>
                            <label class="block font-semibold uppercase text-gray-600 mb-1">Image URL</label>
                            <input type="url" id="item-img" value="${item.imageUrl || ''}" class="w-full p-2.5 border border-gray-300 rounded-xl">
                        </div>

                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="closeModal()" class="flex-1 py-2.5 border border-gray-300 text-gray-700 font-medium rounded-xl">Cancel</button>
                            <button type="submit" class="flex-1 py-2.5 bg-scout-green text-white font-medium rounded-xl">Update Item</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function submitSaveItem(e, itemId) {
            e.preventDefault();
            const items = getLocalItems();
            const title = document.getElementById('item-title').value;
            const category = document.getElementById('item-cat').value;
            const qty = parseInt(document.getElementById('item-qty').value);
            const location = document.getElementById('item-loc').value;
            const condition = document.getElementById('item-cond').value;
            const desc = document.getElementById('item-desc').value;
            const img = document.getElementById('item-img').value || 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=500&auto=format&fit=crop&q=60';

            if (itemId) {
                // Update existing item
                const item = items.find(i => i.id === itemId);
                if (item) {
                    const diff = qty - item.totalQty;
                    item.name = title;
                    item.category = category;
                    item.totalQty = qty;
                    item.availableQty = Math.max(0, item.availableQty + diff);
                    item.location = location;
                    item.condition = condition;
                    item.description = desc;
                    item.imageUrl = img;
                }
            } else {
                // Add new item
                const newItem = {
                    id: 'item_' + Date.now(),
                    name: title,
                    category: category,
                    totalQty: qty,
                    availableQty: qty,
                    location: location,
                    condition: condition,
                    description: desc,
                    icon: 'fa-box-archive',
                    imageUrl: img
                };
                items.push(newItem);
            }

            saveLocalItems(items);
            closeModal();
            showToast(itemId ? "Gear updated!" : "New gear added to store!");
            render();
        }

        function handleDeleteItem(itemId) {
            let items = getLocalItems();
            items = items.filter(i => i.id !== itemId);
            saveLocalItems(items);
            showToast("Item deleted from store", "warn");
            render();
        }

        // ==========================================
        // INITIAL ENTRY POINT
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
